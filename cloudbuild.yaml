steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}', '.']
  
  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}']
  
  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - '${_PROJECT_ID}'
      - '--memory'
      - '512Mi'
      # The site's own origin, used for sitemap.xml, robots.txt and Open Graph
      # tags. Cloud Run does not tell the container its public URL, so it has to
      # be passed in — change _SITE_URL here when a custom domain is mapped.
      - '--set-env-vars'
      - 'NEXT_PUBLIC_SITE_URL=${_SITE_URL}'

substitutions:
  _PROJECT_ID: gonogasport
  _SERVICE_NAME: oynamak
  _REGION: us-central1
  _SITE_URL: https://oynamak-uurxypxfoa-uc.a.run.app

images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${BUILD_ID}'

options:
  logging: CLOUD_LOGGING_ONLY
